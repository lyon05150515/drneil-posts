      ? await crypto.subtle.deriveKey({name: 'PBKDF2', salt: enc('drneil.tw/tg'), iterations: 200000, hash: 'SHA-256'},
          await crypto.subtle.importKey('raw', enc(k), 'PBKDF2', false, ['deriveKey']), {name: 'AES-GCM', length: 128}, false, ['decrypt'])
      : await crypto.subtle.importKey('raw', b(k), 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(box.dataset.iv)}, key, b(box.dataset.ct));
    const d = JSON.parse(new TextDecoder().decode(pt));
    if (d.go) return location.replace(d.go);

    box.innerHTML = d.html;

    if (c) c.onclick = () => navigator.clipboard.writeText(location.href).then(() => { c.textContent = '已複製連結'; });

    };
    document.querySelectorAll('[data-share]').forEach(s => s.onclick = () => {
      const u = new URL(s.dataset.share, location.href).href;
      if (navigator.share) navigator.share({title: s.dataset.title, url: u}).catch(() => {});
      else navigator.clipboard.writeText(u).then(() => { s.textContent = '已複製這一則的連結'; setTimeout(() => s.textContent = '分享這一則', 1800); });
    });
    const l = document.getElementById('tgline');
    if (l) l.href = 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(location.href);
  } catch (e) { fail('連結不完整或已失效'); }
})();
