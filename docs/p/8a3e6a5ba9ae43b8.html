  try {
    const b = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
    const enc = s => new TextEncoder().encode(s);
    // 短的（總覽頁）是密語，用 PBKDF2 算成鑰匙；長的（單則短文）本身就是鑰匙
    const key = k.length < 20

      : await crypto.subtle.importKey('raw', b(k), 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(box.dataset.iv)}, key, b(box.dataset.ct));
    const d = JSON.parse(new TextDecoder().decode(pt));
    if (d.go) return location.replace(d.go);
    document.title = d.title + ' - 思思醫師';

      if (navigator.share) navigator.share({title: s.dataset.title, url: u}).catch(() => {});
